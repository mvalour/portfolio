<footer class="footer">
    <!-- Footer background -->
    <div class="footer-bg"></div>
    <div class="glass-overlay"></div>

    <div class="container">
        <!-- Main footer content -->
        <div class="footer-content">
            <!-- Logo and description -->
            <div class="footer-brand">
                <h3 class="footer-title">
                    <span class="title-gradient">Portfolio</span>
                </h3>
                <p class="footer-description">
                    Développeur passionné créant des expériences numériques innovantes
                </p>

                <!-- Social links -->
                <div class="social-links">
                    <a *ngFor="let social of socialLinks" [href]="social.url" [attr.aria-label]="social.ariaLabel"
                        class="social-link" target="_blank" rel="noopener noreferrer">

                        <!-- LinkedIn Icon -->
                        <svg *ngIf="social.name === 'LinkedIn'" class="social-icon" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <rect x="2" y="9" width="4" height="12" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>

                        <!-- GitHub Icon -->
                        <svg *ngIf="social.name === 'GitHub'" class="social-icon" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M9 18c-4.51 2-5-2-7-2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <!-- Email Icon -->
                        <svg *ngIf="social.name === 'Email'" class="social-icon" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <span class="social-tooltip">{{ social.name }}</span>
                    </a>
                </div>
            </div>

            <!-- Navigation links -->
            <nav class="footer-nav" aria-label="Navigation du pied de page">
                <h4 class="nav-title">Navigation</h4>
                <ul class="footer-links">
                    <li>
                        <a routerLink="/projects" routerLinkActive="active-link" class="footer-link">
                            <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            Projets
                        </a>
                    </li>
                    <li>
                        <a routerLink="/competence" routerLinkActive="active-link" class="footer-link">
                            <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            Compétences
                        </a>
                    </li>
                    <li>
                        <a routerLink="/profile" routerLinkActive="active-link" class="footer-link">
                            <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            Profil & Expériences
                        </a>
                    </li>
                    <li>
                        <a routerLink="/contact" routerLinkActive="active-link" class="footer-link">
                            <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            Me contacter
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Back to top button -->
            <button class="back-to-top" (click)="scrollToTop()" aria-label="Retourner en haut de la page">
                <svg class="back-to-top-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 15l-6-6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span class="back-to-top-text">Haut</span>
            </button>
        </div>

        <!-- Separator -->
        <div class="footer-separator"></div>

        <!-- Bottom section -->
        <div class="footer-bottom">
            <div class="footer-bottom-content">
                <span class="footer-text">
                    © {{ currentYear }} <span class="name-highlight">VALOUR Mathis</span>
                </span>
                <span class="footer-subtext">
                    Développé avec 💜 en Angular
                </span>
            </div>

            <!-- Decorative elements -->
            <div class="decorative-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>
</footer>
