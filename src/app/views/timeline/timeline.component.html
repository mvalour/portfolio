<div class="timeline">
    <div class="timeline-item" *ngFor="let event of events">
        <div class="timeline-icon"></div>
        <div class="timeline-content">
            <h2>{{ event.title }}</h2>
            <p>{{ event.date }}</p>
            <p>{{ event.description }}</p>
        </div>
    </div>
</div>
