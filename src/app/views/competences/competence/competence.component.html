<div *ngIf="activeTab" class="competence-detail">
  <!-- Header de la compétence -->
  <div class="competence-header">
    <div class="competence-badge">
      <span class="badge-text">{{ activeTab.name }}</span>
    </div>
    <h2 class="competence-title">{{ activeTab.title }}</h2>
  </div>

  <!-- Sections grid -->
  <div class="sections-grid">
    <div *ngFor="let section of activeTab.content.sections; let i = index" class="section-card"
      [class.reverse]="i % 2 === 1" [style.animation-delay.ms]="i * 150">

      <!-- Card header -->
      <div class="card-header">
        <div class="step-indicator">
          <span class="step-number">{{ i + 1 }}</span>
        </div>
        <h3 class="section-title">{{ section.title }}</h3>
      </div>

      <!-- Card content -->
      <div class="card-content">
        <p class="section-description">{{ section.description }}</p>

        <div class="card-footer">
          <a [href]="section.link" class="section-link">
            <span>Découvrir</span>
            <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M7 7h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </a>
        </div>
      </div>

      <!-- Card decoration -->
      <div class="card-decoration"></div>
    </div>
  </div>
</div>

<div *ngIf="!activeTab" class="no-selection">
  <div class="no-selection-content">
    <div class="no-selection-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
        <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <line x1="9" y1="9" x2="9.01" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <line x1="15" y1="9" x2="15.01" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    <h3>Sélectionnez une compétence</h3>
    <p>Choisissez une compétence ci-dessus pour voir les détails de son développement.</p>
  </div>
</div>
