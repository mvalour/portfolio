<div class="carousel" *ngIf="projects && projects.length">
    <h2>{{ title }}</h2>
    <div class="carousel-container" [id]="carouselId">
        <div class="carousel-item" *ngFor="let project of projects; let i = index" [class.active]="i === currentIndex">
            <img [src]="project.image" alt="{{ project.title }}">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
        </div>
    </div>
    <button class="prev" (click)="moveCarousel(-1)">&#10094;</button>
    <button class="next" (click)="moveCarousel(1)">&#10095;</button>
</div>
