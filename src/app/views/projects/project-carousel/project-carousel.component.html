<div class="carousel-wrapper" *ngIf="isLoaded">
    <div class="carousel" [id]="carouselId" (mouseenter)="onCarouselMouseEnter()" (mouseleave)="onCarouselMouseLeave()">

        <!-- Navigation Controls -->
        <button class="nav-btn prev-btn" [class.disabled]="!canGoPrev" (click)="moveCarousel(-1)"
            [attr.aria-label]="'Projet précédent'">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>

        <button class="nav-btn next-btn" [class.disabled]="!canGoNext" (click)="moveCarousel(1)"
            [attr.aria-label]="'Projet suivant'">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>

        <!-- Carousel Container -->
        <div class="carousel-container">
            <div class="carousel-track">
                <div *ngFor="let project of projects; let i = index" class="project-card"
                    [class.clickable]="project.demo || project.github" (click)="onProjectClick(project)">

                    <!-- Image Container -->
                    <div class="project-image-container">
                        <img [src]="project.image" [alt]="project.title" class="project-image" loading="lazy">

                        <!-- Image Overlay -->
                        <div class="image-overlay">
                            <div class="overlay-content">
                                <!-- Demo Link -->
                                <button *ngIf="project.demo" class="overlay-btn demo-btn"
                                    (click)="$event.stopPropagation(); window.open(project.demo, '_blank')"
                                    title="Voir la démo">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                                        <polygon points="10,8 16,12 10,16 10,8" fill="currentColor" />
                                    </svg>
                                    Démo
                                </button>

                                <!-- GitHub Link -->
                                <button *ngIf="project.github" class="overlay-btn github-btn"
                                    (click)="$event.stopPropagation(); window.open(project.github, '_blank')"
                                    title="Voir le code">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" />
                                        <path d="M9 18c-4.51 2-5-2-7-2" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    Code
                                </button>
                            </div>
                        </div>

                        <!-- Status Badge -->
                        <div class="status-badge" *ngIf="project.status && project.status !== 'completed'"
                            [style.background-color]="getStatusColor(project.status!)">
                            {{ getStatusLabel(project.status!) }}
                        </div>

                        <!-- Year Badge -->
                        <div class="year-badge" *ngIf="project.year">
                            {{ project.year }}
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="project-content">
                        <h3 class="project-title">{{ project.title }}</h3>
                        <p class="project-description">{{ project.description }}</p>

                        <!-- Technologies -->
                        <div class="project-technologies"
                            *ngIf="project.technologies && project.technologies.length > 0">
                            <span class="tech-badge" *ngFor="let tech of project.technologies">
                                {{ tech }}
                            </span>
                        </div>

                        <!-- Action Indicator -->
                        <div class="action-indicator" *ngIf="project.demo || project.github">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M7 7h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>

                    <!-- Card Hover Effect -->
                    <div class="card-hover-effect"></div>
                </div>
            </div>
        </div>

        <!-- Dots Indicator -->
        <div class="carousel-dots" *ngIf="totalSlides > 1">
            <button *ngFor="let dot of [].constructor(totalSlides); let i = index" class="dot"
                [class.active]="i === currentIndex" (click)="goToSlide(i)"
                [attr.aria-label]="'Aller à la page ' + (i + 1)">
            </button>
        </div>

        <!-- Auto-play Indicator -->
        <div class="autoplay-indicator" *ngIf="isAutoPlaying">
            <div class="autoplay-progress"></div>
        </div>
    </div>
</div>

<!-- Loading State -->
<div class="carousel-loading" *ngIf="!isLoaded">
    <div class="loading-spinner"></div>
    <p>Chargement des projets...</p>
</div>

<!-- Empty State -->
<div class="carousel-empty" *ngIf="isLoaded && projects.length === 0">
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" />
    </svg>
    <h3>Aucun projet trouvé</h3>
    <p>Les projets seront bientôt disponibles.</p>
</div>
