<section class="contact">
    <!-- Background elements -->
    <div class="contact-bg">
        <div class="bg-gradient"></div>
        <div class="bg-pattern"></div>
        <div class="floating-elements">
            <div class="floating-circle circle-1"></div>
            <div class="floating-circle circle-2"></div>
            <div class="floating-circle circle-3"></div>
        </div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <div class="contact-header">
            <div class="header-content">
                <h1 class="main-title">
                    <span class="title-gradient">Contactez-moi</span>
                </h1>
                <p class="subtitle">
                    N'hésitez pas à me contacter pour toute question ou opportunité.
                    <br>Je serais ravi d'échanger avec vous !
                </p>
            </div>

            <!-- Decorative element -->
            <div class="header-decoration">
                <svg class="decoration-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="30" fill="none" stroke="var(--accent-color)" stroke-width="2"
                        opacity="0.3">
                        <animate attributeName="r" values="30;35;30" dur="2s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
        </div>

        <!-- Contact Information -->
        <div class="contact-content">
            <!-- Personal Info Cards -->
            <div class="contact-info-grid">
                <div *ngFor="let item of contactInfo; let i = index" class="contact-card"
                    [class.clickable]="item.link || item.type === 'location'" (click)="onContactClick(item)"
                    [style.animation-delay.ms]="i * 100">

                    <!-- Icon -->
                    <div class="card-icon">
                        <!-- User Icon -->
                        <svg *ngIf="item.icon === 'user'" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>

                        <!-- Calendar Icon -->
                        <svg *ngIf="item.icon === 'calendar'" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor"
                                stroke-width="2" />
                            <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" />
                            <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" />
                            <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" />
                        </svg>

                        <!-- Phone Icon -->
                        <svg *ngIf="item.icon === 'phone'" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <!-- Mail Icon -->
                        <svg *ngIf="item.icon === 'mail'" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <!-- Map Pin Icon -->
                        <svg *ngIf="item.icon === 'map-pin'" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>

                    <!-- Content -->
                    <div class="card-content">
                        <h3 class="card-label">{{ item.label }}</h3>
                        <p class="card-value">{{ item.value }}</p>
                    </div>

                    <!-- Action indicator -->
                    <div class="card-action" *ngIf="item.link || item.type === 'location'">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M7 7h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>

                    <!-- Copy button -->
                    <button class="copy-btn" *ngIf="item.type === 'email' || item.type === 'phone'"
                        (click)="$event.stopPropagation(); copyToClipboard(item.value)" title="Copier">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke="currentColor"
                                stroke-width="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor"
                                stroke-width="2" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Separator -->
            <div class="separator">
                <div class="separator-line"></div>
                <div class="separator-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"
                            stroke="currentColor" stroke-width="2" />
                    </svg>
                </div>
                <div class="separator-line"></div>
            </div>

            <!-- Social Media Cards -->
            <div class="social-section">
                <h2 class="section-title">
                    <span class="title-accent">Retrouvez-moi sur</span>
                </h2>

                <div class="social-grid">
                    <a *ngFor="let social of socialLinks; let i = index" [href]="social.url" target="_blank"
                        rel="noopener noreferrer" class="social-card"
                        [style.animation-delay.ms]="(contactInfo.length + i) * 100">

                        <!-- Background gradient -->
                        <div class="social-bg"
                            [style.background]="'linear-gradient(135deg, ' + social.color + '20, ' + social.color + '10)'">
                        </div>

                        <!-- Icon -->
                        <div class="social-icon" [style.color]="social.color">
                            <!-- LinkedIn Icon -->
                            <svg *ngIf="social.icon === 'linkedin'" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                                <rect x="2" y="9" width="4" height="12" />
                                <circle cx="4" cy="4" r="2" />
                            </svg>

                            <!-- GitHub Icon -->
                            <svg *ngIf="social.icon === 'github'" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                                <path d="M9 18c-4.51 2-5-2-7-2" />
                            </svg>

                            <!-- Instagram Icon -->
                            <svg *ngIf="social.icon === 'instagram'" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="white" />
                                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="white" stroke-width="2" />
                            </svg>
                        </div>

                        <!-- Content -->
                        <div class="social-content">
                            <h3 class="social-name">{{ social.name }}</h3>
                            <p class="social-description">{{ social.description }}</p>
                        </div>

                        <!-- Hover effect -->
                        <div class="social-hover-effect"></div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
