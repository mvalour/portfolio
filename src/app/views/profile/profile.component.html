<section class="profile">
    <!-- Background Elements -->
    <div class="profile-bg">
        <div class="bg-gradient"></div>
        <div class="bg-pattern"></div>
        <div class="floating-elements">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="floating-shape shape-4"></div>
        </div>
    </div>

    <div class="container">
        <!-- Hero Section avec Photo -->
        <div class="hero-section">
            <!-- Lignes décoratives animées -->
            <div class="decorative-line line-left">
                <div class="line-fill"></div>
                <div class="line-glow"></div>
            </div>

            <!-- Photo de profil avec effects -->
            <div class="profile-picture-container">
                <div class="picture-glow"></div>
                <div class="picture-border"></div>
                <div class="profile-picture">
                    <img src="../../../assets/img/autres/profil.jpg" alt="Photo de profil de Mathis Valour"
                        (load)="onProfileImageLoad()">
                    <div class="picture-overlay"></div>
                </div>
                <div class="picture-decoration">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="var(--accent-color)" stroke-width="1"
                            opacity="0.6">
                            <animate attributeName="r" values="45;48;45" dur="3s" repeatCount="indefinite" />
                            <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite" />
                        </circle>
                    </svg>
                </div>
            </div>

            <!-- Lignes décoratives animées -->
            <div class="decorative-line line-right">
                <div class="line-fill"></div>
                <div class="line-glow"></div>
            </div>
        </div>

        <!-- Informations du profil -->
        <div class="profile-content">
            <div class="profile-info">
                <h1 class="profile-name">
                    <span class="name-gradient">{{ profileData.name }}</span>
                </h1>

                <h2 class="profile-title">{{ profileData.title }}</h2>

                <p class="profile-subtitle">{{ profileData.subtitle }}</p>

                <!-- Informations détaillées -->
                <div class="profile-details">
                    <div class="detail-item">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <span>{{ profileData.location }}</span>
                    </div>

                    <div class="detail-item">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor"
                                stroke-width="2" />
                            <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" />
                            <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" />
                            <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" />
                        </svg>
                        <span>{{ profileData.age }} ans</span>
                    </div>

                    <div class="detail-item status">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                            <path
                                d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"
                                stroke="currentColor" stroke-width="2" />
                        </svg>
                        <span>{{ profileData.status }}</span>
                        <div class="status-indicator"></div>
                    </div>
                </div>
            </div>

            <!-- Statistiques -->
            <div class="profile-stats">
                <div class="stats-grid">
                    <div *ngFor="let stat of profileData.stats; let i = index" class="stat-card"
                        [style.animation-delay.ms]="i * 100">
                        <div class="stat-value">{{ stat.value }}</div>
                        <div class="stat-label">{{ stat.label }}</div>
                        <div class="stat-decoration"></div>
                    </div>
                </div>
            </div>

            <!--  Expériences -->
            <div class="skills-container">
                <h3 class="skills-title">Mes expériences</h3>
                <div class="skills-grid">
                    <button *ngFor="let skill of profileData.skills; let i = index" class="skill-tag"
                        (click)="onSkillClick(skill)" [style.animation-delay.ms]="i * 50">
                        {{ skill }}
                        <div class="skill-glow"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Timeline Section -->
    <div class="timeline-section">
        <div class="section-divider">
            <div class="divider-line"></div>
            <div class="divider-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z" stroke="currentColor"
                        stroke-width="2" />
                </svg>
            </div>
            <div class="divider-line"></div>
        </div>

        <app-timeline></app-timeline>
    </div>
</section>
