<section class="languages">
    <div class="container">
        <!-- Header Section -->
        <div class="languages-header">
            <h2 class="section-title">
                <span class="title-gradient">Technologies & Outils</span>
            </h2>
            <p class="section-subtitle">
                Découvrez les technologies et outils que je maîtrise dans différents domaines du développement.
            </p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-buttons">
                <button class="filter-button active" (click)="filterLanguages('all')"
                    [class.active]="activeFilter === 'all'">
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                        <path
                            d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"
                            stroke="currentColor" stroke-width="2" />
                    </svg>
                    <span>Tous</span>
                    <span class="count">{{ getTotalCount() }}</span>
                </button>

                <button class="filter-button" (click)="filterLanguages('frontend')"
                    [class.active]="activeFilter === 'frontend'">
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2" stroke="currentColor" stroke-width="2" />
                        <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" />
                        <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" />
                    </svg>
                    <span>Frontend</span>
                    <span class="count">{{ getCountByType('frontend') }}</span>
                </button>

                <button class="filter-button" (click)="filterLanguages('backend')"
                    [class.active]="activeFilter === 'backend'">
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2" stroke="currentColor" stroke-width="2" />
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2" stroke="currentColor" stroke-width="2" />
                        <line x1="6" y1="6" x2="6" y2="6" stroke="currentColor" stroke-width="2" />
                        <line x1="6" y1="18" x2="6" y2="18" stroke="currentColor" stroke-width="2" />
                    </svg>
                    <span>Backend</span>
                    <span class="count">{{ getCountByType('backend') }}</span>
                </button>

                <button class="filter-button" (click)="filterLanguages('database')"
                    [class.active]="activeFilter === 'database'">
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="12" cy="5" rx="9" ry="3" stroke="currentColor" stroke-width="2" />
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" stroke="currentColor" stroke-width="2" />
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" stroke="currentColor" stroke-width="2" />
                    </svg>
                    <span>Base de données</span>
                    <span class="count">{{ getCountByType('database') }}</span>
                </button>

                <button class="filter-button" (click)="filterLanguages('tool')"
                    [class.active]="activeFilter === 'tool'">
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                            stroke="currentColor" stroke-width="2" />
                    </svg>
                    <span>Outils</span>
                    <span class="count">{{ getCountByType('tool') }}</span>
                </button>
            </div>
        </div>

        <!-- Languages Grid -->
        <div class="languages-grid" *ngIf="filteredLanguages.length > 0">
            <div *ngFor="let language of filteredLanguages; let i = index" class="language-card"
                [attr.data-type]="language.type" [style.animation-delay.ms]="i * 100">

                <!-- Card header with image -->
                <div class="card-header">
                    <div class="image-container">
                        <img [src]="language.image" [alt]="language.name" class="language-image">
                        <div class="image-overlay"></div>
                    </div>
                    <div class="type-badge" [class]="language.type">
                        {{ getTypeLabel(language.type) }}
                    </div>
                </div>

                <!-- Card content -->
                <div class="card-content">
                    <h3 class="language-name">{{ language.name }}</h3>
                    <p class="language-description">{{ language.description }}</p>
                </div>

                <!-- Card decoration -->
                <div class="card-decoration"></div>
            </div>
        </div>

        <!-- Empty state -->
        <div class="empty-state" *ngIf="filteredLanguages.length === 0">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                    <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" />
                </svg>
            </div>
            <h3>Aucune technologie trouvée</h3>
            <p>Essayez un autre filtre pour voir les technologies disponibles.</p>
        </div>
    </div>
</section>
