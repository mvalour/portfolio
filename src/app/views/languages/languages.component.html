<section class="languages">
    <div class="filter-buttons">
        <button class="filter-button active" (click)="filterLanguages('all')">Tous</button>
        <button class="filter-button" (click)="filterLanguages('frontend')">Frontend</button>
        <button class="filter-button" (click)="filterLanguages('backend')">Backend</button>
        <button class="filter-button" (click)="filterLanguages('database')">Base de données</button>
    </div>
    <div class="language-cards">
        <div class="language-card frontend" *ngFor="let language of languages">
            <h3>{{ language.name }}</h3>
            <img [src]="language.image" [alt]="language.name">
            <p>{{ language.description }}</p>
        </div>
    </div>
</section>
