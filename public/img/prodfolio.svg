<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prodfolio">
  <defs>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="12" y1="14" x2="52" y2="50">
      <stop offset="0" stop-color="#c084fc" />
      <stop offset="1" stop-color="#7c3aed" />
